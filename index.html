
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZombieTz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div id="goldBox">🪙 <span id="gold">0</span> Gold</div>
      <button id="menuButton">MENU</button>
    </div>

    <div id="mainMenu" class="screen">
      <h1>ZOMBIETZ</h1>
      <p>Survive the zombie road!</p>

      <button id="playButton" class="imageButton">
        <img src="play.png" alt="Play">
      </button>

      <button id="shopButton" class="imageButton">
        <img src="Shop.png" alt="Shop">
      </button>
    </div>

    <div id="shopScreen" class="screen hidden">
      <h2>SHOP</h2>
      <p>Your Gold: <span id="shopGold">0</span></p>
      <p>More upgrades coming soon!</p>
      <button id="backButton">BACK</button>
    </div>

    <div id="gameOver" class="screen hidden">
      <h2>GAME OVER</h2>
      <p>Gold earned: <span id="finalGold">0</span></p>
      <button id="restartButton">PLAY AGAIN</button>
      <button id="homeButton">HOME</button>
    </div>

    <div id="controls" class="hidden">
      <button id="leftButton" class="controlButton">◀</button>
      <button id="shootButton" class="controlButton shoot">SHOOT</button>
      <button id="rightButton" class="controlButton">▶</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
